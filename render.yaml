# Render blueprint — a plain static site, no build step.
# Dashboard route: New → Blueprint → pick this repo. Or New → Static Site with publish directory ".".
services:
  - type: web
    name: dooz-cafe
    runtime: static
    buildCommand: echo "static site, nothing to build"
    staticPublishPath: .
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
